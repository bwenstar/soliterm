[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soliterm"
dynamic = ["version"]
description = "Solitaire for your terminal, AisleRiot-compatible: twelve games in curses or plain text"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brendan Ta" }]
keywords = [
    "solitaire", "patience", "card-game", "cards", "klondike", "spider",
    "freecell", "golf", "aisleriot", "gnome", "curses", "tui", "terminal",
    "console", "game",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Typing :: Typed",
]
# Standard library only. curses ships with CPython on Linux and macOS; on
# Windows it comes from the windows-curses wheel.
dependencies = ['windows-curses>=2.3; sys_platform == "win32"']

[project.urls]
Homepage = "https://github.com/bwenstar/soliterm"
Documentation = "https://github.com/bwenstar/soliterm/tree/main/docs"
Changelog = "https://github.com/bwenstar/soliterm/blob/main/CHANGELOG.md"
Issues = "https://github.com/bwenstar/soliterm/issues"
Source = "https://github.com/bwenstar/soliterm"

[project.scripts]
soliterm = "soliterm.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    # the same versions as the lint job in CI (and ruff as in pre-commit).
    # mypy 2.3.1 needs Python 3.10 or newer, so on 3.9 the group leaves it
    # out rather than failing to install.
    "ruff==0.16.6",
    "mypy==2.3.1; python_version >= '3.10'",
    "vermin==1.8.0",
    "build",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "soliterm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soliterm = ["py.typed"]

[tool.ruff]
target-version = "py39"
# Most lines are under 88 already. 100 lets the few longer f-strings and
# test names stay on one line instead of being split up.
line-length = 100

[tool.ruff.lint]
# Spelled out rather than left to ruff's default set, which a new ruff
# release can change. It holds all of that set as of 0.16.6, bar the
# async, logging, stub file, gettext and py.path checks (ASYNC, LOG, G,
# PYI, INT, PTH124), which have nothing to look at in this code, and more
# besides.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade, as far as Python 3.9 allows
    "FA",       # newer annotation syntax needs from __future__ import annotations
    "SIM",      # simplify
    "C4",       # comprehensions
    "RET",      # return statements
    "RUF",      # ruff's own
    "PIE",      # misc
    "FURB",     # refurb
    "PL",       # pylint
    "PT",       # pytest
    "PGH",      # blanket noqa and type: ignore
    "BLE",      # blind except
    "ISC",      # implicit string concatenation
    "YTT",      # sys.version checks
    "EXE",      # shebangs
    "T10",      # leftover breakpoints
    # the checks from these that catch mistakes rather than style
    "PERF101", "PERF102", "PERF402",
    "TC004", "TC005", "TC010",
    "TRY002", "TRY004", "TRY201", "TRY203",
    # the rest of ruff's default set
    "DTZ", "D419", "FLY002", "N999", "PTH210",
    "S102", "S110", "S112", "TC007", "TRY401",
]
ignore = [
    "PLR09",    # too many branches or arguments: game rules are long
    "PLR2004",  # ranks and column counts read best as plain numbers
    "PLC0415",  # imports in functions keep startup quick, break cycles
    "SIM105",   # try/except/pass is plainer than contextlib.suppress
    "RUF005",   # a + [b] reads as well as [*a, b]
    "PT006",    # "a, b" as parametrize names is fine
    "PT018",    # an assert with "and" is fine in a test
]

[tool.ruff.lint.isort]
known-first-party = ["soliterm"]
# tests/helpers.py, imported last in the tests, after the package itself
known-local-folder = ["helpers"]

[tool.mypy]
# The floor is 3.9, but mypy no longer checks against anything older than
# 3.10. vermin and the 3.9 test run cover what 3.10 lets through.
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package straight from src/ without installing it (and tests/
# for the shared helpers module).
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["soliterm"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
