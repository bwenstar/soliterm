name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the linters
        run: python -m pip install ruff==0.16.6 mypy==2.3.1 vermin==1.8.0
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Holds the code to the requires-python floor in pyproject.toml.
      - run: vermin -t=3.9- --no-tips --violations --eval-annotations src

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}${{ matrix.utf8 == '0' && ' without UTF-8 mode' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # A cell marked experimental can fail without failing the run.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # PYTHONUTF8 for the tests: on, as in the env above, but off for
        # the one cell below that runs without it.
        utf8: ["1"]
        # Every version runs on Linux. macOS and Windows get the oldest
        # and the newest, which is where platform trouble tends to show,
        # and the one still to come.
        exclude:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
        include:
          - { os: ubuntu-latest, python: "3.13", coverage: true }
          # Windows as players have it: without UTF-8 mode, which only
          # 3.15 turns on by default, files and pipes go through the ANSI
          # code page.
          - { os: windows-latest, python: "3.9", utf8: "0" }
          # 3.15 is still a prerelease. Take experimental off once 3.15.0
          # is out.
          - { python: "3.15", experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      # On Windows this also pulls in windows-curses, through the
      # sys_platform marker on the dependency.
      - name: Install
        run: python -m pip install -e . pytest
      - name: Run the tests
        if: ${{ !matrix.coverage }}
        env:
          PYTHONUTF8: ${{ matrix.utf8 }}
        run: python -m pytest -q
      - name: Run the tests under coverage
        if: ${{ matrix.coverage }}
        run: |
          python -m pip install coverage
          python -m coverage run -m pytest -q
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install build twine pytest
      # build_pyz.py empties dist/ before it writes the zipapp, so it has
      # to run before python -m build, not after.
      - name: Build the zipapp
        run: python tools/build_pyz.py
      - name: Build the sdist and wheel
        run: python -m build
      - name: Check the package metadata
        run: twine check --strict dist/*.whl dist/*.tar.gz
      # As a packager runs them: from the unpacked sdist, away from the
      # checkout, under the C locale and without UTF-8 mode.
      - name: Run the tests from the sdist
        env:
          LC_ALL: C
          LANG: C
          PYTHONUTF8: "0"
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/soliterm-*/
          python -m pytest -q -p no:cacheprovider
      - name: Smoke test the zipapp
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/home/.local/share
        run: |
          mkdir -p "$HOME"
          python dist/soliterm.pyz --version
          python dist/soliterm.pyz --list
          printf 'hint\nq\n' | python dist/soliterm.pyz --text --game freecell --deal 1 --ascii --no-color
      - name: Install the wheel into a clean venv
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/home/.local/share
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/venv/bin/soliterm" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
