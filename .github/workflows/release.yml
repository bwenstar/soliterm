name: Release

# Runs when a version tag is pushed, such as v1.2.0 or v1.3.0rc1. The tag
# must be soliterm.__version__ with a v in front, and CHANGELOG.md needs a
# "## [1.2.0] - date" section for it. Tag a commit that CI has passed.
#
# Stable versions go to PyPI; rc tags go to TestPyPI and become GitHub
# pre-releases, as do alphas and betas. Publishing uses PyPI's trusted
# publishing, so the repository needs environments called pypi and
# testpypi, and each index needs this workflow added as a trusted
# publisher under that environment name.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      rc: ${{ steps.version.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install build twine
      - name: Check the tag against the package version
        id: version
        run: |
          python -m pip install -e .
          version=$(python -c 'import soliterm; print(soliterm.__version__)')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match soliterm.__version__ ($version)"
            exit 1
          fi
          prerelease=false
          rc=false
          case $version in
            *rc[0-9]*) prerelease=true; rc=true ;;
            *a[0-9]* | *b[0-9]* | *.dev[0-9]*) prerelease=true ;;
          esac
          echo "Releasing $version (prerelease: $prerelease)"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"

      # From here to the upload, keep in step with the build job in ci.yml.
      # build_pyz.py empties dist/ before it writes the zipapp, so it has
      # to run before python -m build, not after.
      - name: Build the zipapp
        run: python tools/build_pyz.py
      - name: Build the sdist and wheel
        run: python -m build
      - name: Check the package metadata
        run: twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke test the zipapp
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/home/.local/share
        run: |
          mkdir -p "$HOME"
          python dist/soliterm.pyz --version
          python dist/soliterm.pyz --list
          printf 'hint\nq\n' | python dist/soliterm.pyz --text --game freecell --seed 1 --ascii --no-color
      - name: Install the wheel into a clean venv
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/home/.local/share
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/venv/bin/soliterm" --version
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          notes, found = [], False
          with open("CHANGELOG.md", encoding="utf-8") as f:
              for line in f:
                  heading = re.match(r"## \[?v?([^\]\s]+)\]?", line)
                  if heading:
                      if found:
                          break
                      found = heading.group(1) == version
                  elif found and not re.match(r"\[[^\]]+\]: ", line):
                      notes.append(line)
          text = "".join(notes).strip()
          if not text:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          with open("notes.md", "w", encoding="utf-8") as f:
              f.write(text + "\n")
          EOF
          cat notes.md
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Soliterm $VERSION" --notes-file notes.md \
            "${flags[@]}" dist/*

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/soliterm/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The index only takes the wheel and the sdist. The zipapp is on the
      # GitHub release.
      - run: rm dist/soliterm.pyz
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: Publish to TestPyPI
    needs: [build, github-release]
    if: needs.build.outputs.rc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/soliterm/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm dist/soliterm.pyz
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
