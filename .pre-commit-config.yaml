# pip install pre-commit && pre-commit install
# "pre-commit autoupdate" moves the revs below to the latest releases.
# ruff's rev is pinned to the same version as ci.yml, the dev group in
# pyproject.toml and CONTRIBUTING.md, so if it moves, move those with it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
